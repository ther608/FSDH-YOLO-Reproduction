# YOLO11n + original SPDConv at the input stem + SHAB-M at P3/P4/P5.
# Controlled counterpart of yolo11n_FSDConv-SHAB-mid.yaml: only SPDConv vs
# FSDConv differs, isolating whether the preferred SHAB branch depends on the
# original or adapted space-to-depth projection.
nc: 3
scale: n
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, SPDConv, [64, 3]]  # SPDConv@Input: RGB -> P1/2
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, SHAB, ["M"]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, SHAB, ["M"]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]
  - [-1, 1, SHAB, ["M"]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]
  - [[19, 22, 25], 1, Detect, [nc]]
