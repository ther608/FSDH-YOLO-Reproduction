# Paper-principle reproduction, not author-released PEANet-YOLOv5-D code.
# Adaptive RGB enhancement + cooperative channel/spatial attention + DIoU.
nc: 3
scale: s
scales:
  s: [0.33, 0.50, 1024]

backbone:
  - [-1, 1, AdaptiveColorEnhanceRepro, []]       # 0 RGB enhancement
  - [-1, 1, Conv, [64, 6, 2, 2]]                # 1 P1/2
  - [-1, 1, Conv, [128, 3, 2]]                  # 2 P2/4
  - [-1, 3, C3, [128]]                          # 3
  - [-1, 1, Conv, [256, 3, 2]]                  # 4 P3/8
  - [-1, 6, C3, [256]]                          # 5
  - [-1, 1, Conv, [512, 3, 2]]                  # 6 P4/16
  - [-1, 9, C3, [512]]                          # 7
  - [-1, 1, Conv, [1024, 3, 2]]                 # 8 P5/32
  - [-1, 3, C3, [1024]]                         # 9
  - [-1, 1, SPPF, [1024, 5]]                    # 10

head:
  - [-1, 1, Conv, [512, 1, 1]]                  # 11
  - [-1, 1, nn.Upsample, [None, 2, nearest]]    # 12
  - [[-1, 7], 1, Concat, [1]]                   # 13
  - [-1, 3, C3, [512, False]]                   # 14
  - [-1, 1, Conv, [256, 1, 1]]                  # 15
  - [-1, 1, nn.Upsample, [None, 2, nearest]]    # 16
  - [[-1, 5], 1, Concat, [1]]                   # 17
  - [-1, 3, C3, [256, False]]                   # 18 P3/8
  - [-1, 1, PEANetAttentionRepro, []]            # 19
  - [-1, 1, Conv, [256, 3, 2]]                  # 20
  - [[-1, 15], 1, Concat, [1]]                  # 21
  - [-1, 3, C3, [512, False]]                   # 22 P4/16
  - [-1, 1, PEANetAttentionRepro, []]            # 23
  - [-1, 1, Conv, [512, 3, 2]]                  # 24
  - [[-1, 11], 1, Concat, [1]]                  # 25
  - [-1, 3, C3, [1024, False]]                  # 26 P5/32
  - [-1, 1, PEANetAttentionRepro, []]            # 27
  - [[19, 23, 27], 1, Detect, [nc]]              # 28
