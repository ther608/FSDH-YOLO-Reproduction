# Paper-principle reproduction, not author-released YOLOv8-FPDW code.
# FasterNet-style backbone + ParNetAttention + lightweight DADet + WIoU-v3.
nc: 3
scale: n
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                   # 0 P1/2
  - [-1, 1, Conv, [128, 3, 2]]                  # 1 P2/4
  - [-1, 3, C2fFaster, [128, True]]             # 2
  - [-1, 1, Conv, [256, 3, 2]]                  # 3 P3/8
  - [-1, 6, C2fFaster, [256, True]]             # 4
  - [-1, 1, Conv, [512, 3, 2]]                  # 5 P4/16
  - [-1, 6, C2fFaster, [512, True]]             # 6
  - [-1, 1, Conv, [1024, 3, 2]]                 # 7 P5/32
  - [-1, 3, C2fFaster, [1024, True]]            # 8
  - [-1, 1, SPPF, [1024, 5]]                    # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]    # 10
  - [[-1, 6], 1, Concat, [1]]                   # 11
  - [-1, 3, C2f, [512]]                         # 12
  - [-1, 1, nn.Upsample, [None, 2, nearest]]    # 13
  - [[-1, 4], 1, Concat, [1]]                   # 14
  - [-1, 3, C2f, [256]]                         # 15 P3/8
  - [-1, 1, ParNetAttention, []]                 # 16
  - [-1, 1, Conv, [256, 3, 2]]                  # 17
  - [[-1, 12], 1, Concat, [1]]                  # 18
  - [-1, 3, C2f, [512]]                         # 19 P4/16
  - [-1, 1, ParNetAttention, []]                 # 20
  - [-1, 1, Conv, [512, 3, 2]]                  # 21
  - [[-1, 9], 1, Concat, [1]]                   # 22
  - [-1, 3, C2f, [1024]]                        # 23 P5/32
  - [-1, 1, ParNetAttention, []]                 # 24
  - [[16, 20, 24], 1, DADetectRepro, [nc]]      # 25
