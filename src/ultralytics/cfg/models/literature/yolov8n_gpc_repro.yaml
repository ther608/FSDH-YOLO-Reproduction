# GPC-YOLOv8n paper-principle reproduction for controlled Dataset-A comparison.
# C2f-PC, GSConv and SimAM follow the authors' public modules. Their repository
# does not publish a full YAML/CCFF implementation; the neck therefore follows
# the paper's stated all-256-channel adjacent-scale fusion design.
nc: 3
scale: n
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, GSConvRepro, [128, 3, 2]]
  - [-1, 3, C2fPCRepro, [128, True]]
  - [-1, 1, GSConvRepro, [256, 3, 2]]
  - [-1, 6, C2fPCRepro, [256, True]]
  - [-1, 1, GSConvRepro, [512, 3, 2]]
  - [-1, 6, C2fPCRepro, [512, True]]
  - [-1, 1, GSConvRepro, [1024, 3, 2]]
  - [-1, 3, C2fPCRepro, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2fPCRepro, [256]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2fPCRepro, [256]]
  - [-1, 1, SimAM, [0.0001]]
  - [-1, 1, GSConvRepro, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 3, C2fPCRepro, [256]]
  - [-1, 1, SimAM, [0.0001]]
  - [-1, 1, GSConvRepro, [256, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 3, C2fPCRepro, [256]]
  - [-1, 1, SimAM, [0.0001]]
  - [[17, 21, 25], 1, Detect, [nc]]
