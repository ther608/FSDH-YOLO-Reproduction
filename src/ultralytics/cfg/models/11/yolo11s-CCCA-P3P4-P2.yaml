# YOLO11s-CCCA-P3P4 + P2: CCCA on P3/P4 bottom-up + high-resolution P2/4 branch
# CCCA refines P3/P4 after fusion; P2 adds dense tiny-target detection.
nc: 3
scale: s
scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                      # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]                     # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]              # 2  P2/4
  - [-1, 1, Conv, [256, 3, 2]]                     # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]              # 4  P3/8
  - [-1, 1, Conv, [512, 3, 2]]                     # 5  P4/16
  - [-1, 2, C3k2, [512, True]]                     # 6  P4/16
  - [-1, 1, Conv, [1024, 3, 2]]                    # 7  P5/32
  - [-1, 2, C3k2, [1024, True]]                    # 8  P5/32
  - [-1, 1, SPPF, [1024, 5]]                       # 9
  - [-1, 2, C2PSA, [1024]]                         # 10

head:
  # top-down P5→P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 11
  - [[-1, 6], 1, Concat, [1]]                       # 12
  - [-1, 2, C3k2, [512, False]]                    # 13

  # top-down P4→P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 14
  - [[-1, 4], 1, Concat, [1]]                       # 15
  - [-1, 2, C3k2, [256, False]]                    # 16

  # top-down P3→P2
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 17
  - [[-1, 2], 1, Concat, [1]]                       # 18
  - [-1, 2, C3k2, [128, False]]                    # 19  P2/4 tiny

  # bottom-up P2→P3
  - [-1, 1, Conv, [128, 3, 2]]                     # 20
  - [[-1, 16], 1, Concat, [1]]                      # 21
  - [-1, 2, C3k2, [256, False]]                    # 22  P3/8 small
  - [-1, 1, CCCA, [16, 16, 7]]                     # 23  CCCA on P3

  # bottom-up P3→P4
  - [-1, 1, Conv, [256, 3, 2]]                     # 24
  - [[-1, 13], 1, Concat, [1]]                      # 25
  - [-1, 2, C3k2, [512, False]]                    # 26  P4/16 medium
  - [-1, 1, CCCA, [16, 16, 7]]                     # 27  CCCA on P4

  # bottom-up P4→P5
  - [-1, 1, Conv, [512, 3, 2]]                     # 28
  - [[-1, 10], 1, Concat, [1]]                      # 29
  - [-1, 2, C3k2, [1024, True]]                    # 30  P5/32 large

  # Detect: P2, P3, P4, P5
  - [[19, 23, 27, 30], 1, Detect, [nc]]            # 31