# Ultralytics YOLO11s + Lite-BiFPN + CARAFE
# BiFPN weighted fusion + CARAFE content-aware upsampling.
nc: 3
scale: s
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                      # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]                     # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]              # 2
  - [-1, 1, Conv, [256, 3, 2]]                     # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]              # 4  P3/8
  - [-1, 1, Conv, [512, 3, 2]]                     # 5  P4/16
  - [-1, 2, C3k2, [512, True]]                     # 6  P4/16
  - [-1, 1, Conv, [1024, 3, 2]]                    # 7  P5/32
  - [-1, 2, C3k2, [1024, True]]                    # 8
  - [-1, 1, SPPF, [1024, 5]]                       # 9
  - [-1, 2, C2PSA, [1024]]                         # 10 P5/32

head:
  # top-down: P5 → P4
  - [-1, 1, Conv, [512, 1, 1]]                     # 11 reduce P5: 1024→512
  - [-1, 1, CARAFE, [2, 5, 3, 64]]                 # 12 CARAFE P5↑P4
  - [[-1, 6], 1, BiFPN_Add2, [512]]                # 13 fuse P5_up + backbone P4
  - [-1, 2, C3k2, [512, False]]                    # 14 P4_td

  # top-down: P4 → P3
  - [-1, 1, Conv, [512, 1, 1]]                     # 15 reduce P4_td: 256→256 (match backbone P3)
  - [-1, 1, CARAFE, [2, 5, 3, 64]]                 # 16 CARAFE P4↑P3
  - [[-1, 4], 1, BiFPN_Add2, [256]]                # 17 fuse P4_up + backbone P3
  - [-1, 2, C3k2, [256, False]]                    # 18 P3_out

  # bottom-up: P3 → P4
  - [-1, 1, Conv, [512, 3, 2]]                     # 19 downsample P3→P4, 256→512
  - [[-1, 14, 6], 1, BiFPN_Add3, [512]]            # 20 fuse P3_down + P4_td + backbone P4
  - [-1, 2, C3k2, [512, False]]                    # 21 P4_out

  # bottom-up: P4 → P5
  - [-1, 1, Conv, [1024, 3, 2]]                    # 22 downsample P4→P5, 512→1024
  - [[-1, 10], 1, BiFPN_Add2, [1024]]              # 23 fuse P4_down + backbone P5
  - [-1, 2, C3k2, [1024, True]]                    # 24 P5_out

  - [[18, 21, 24], 1, Detect, [nc]]                # 25