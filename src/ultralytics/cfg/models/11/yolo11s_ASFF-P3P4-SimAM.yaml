# YOLO11s + ASFF-P3P4 + SimAM: ASFF cross-scale fusion on P3/P4,
# then SimAM attention on fused P3/P4 features.
# SimAM is parameter-free — lightweight baseline for attention comparison.
nc: 3
scale: s
scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                      # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]                     # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]              # 2
  - [-1, 1, Conv, [256, 3, 2]]                     # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]              # 4  P3/8
  - [-1, 1, Conv, [512, 3, 2]]                     # 5  P4/16
  - [-1, 2, C3k2, [512, True]]                     # 6  P4/16
  - [-1, 1, Conv, [1024, 3, 2]]                    # 7  P5/32
  - [-1, 2, C3k2, [1024, True]]                    # 8
  - [-1, 1, SPPF, [1024, 5]]                       # 9
  - [-1, 2, C2PSA, [1024]]                         # 10 P5/32

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 11
  - [[-1, 6], 1, Concat, [1]]                       # 12
  - [-1, 2, C3k2, [512, False]]                    # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 14
  - [[-1, 4], 1, Concat, [1]]                       # 15
  - [-1, 2, C3k2, [256, False]]                    # 16 P3/8
  - [-1, 1, Conv, [256, 3, 2]]                     # 17
  - [[-1, 13], 1, Concat, [1]]                      # 18
  - [-1, 2, C3k2, [512, False]]                    # 19 P4/16
  - [-1, 1, Conv, [512, 3, 2]]                     # 20
  - [[-1, 10], 1, Concat, [1]]                      # 21
  - [-1, 2, C3k2, [1024, True]]                    # 22 P5/32

  # ASFF2: cross-scale fusion P3/P4
  - [[16, 19], 1, ASFF2, [8]]                      # 23
  - [23, 1, FeatureIndex, [0]]                     # 24 P3_fused
  - [-1, 1, SimAM, [1e-4]]                         # 25 P3_fused + SimAM
  - [23, 1, FeatureIndex, [1]]                     # 26 P4_fused
  - [-1, 1, SimAM, [1e-4]]                         # 27 P4_fused + SimAM

  - [[25, 27, 22], 1, Detect, [nc]]                # 28
