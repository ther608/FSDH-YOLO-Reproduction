# YOLO11s + CTE: Color-Texture Enhancement on P3 and P4.
# CTE enhances low-freq color trends and high-freq texture details —
# critical for distinguishing unripe → semi-ripe → ripe transitions.
# P3 CTE: fine-grained texture + small object context.
# P4 CTE: mid-level color + background texture.
nc: 3
scale: s
scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                      # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]                     # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]              # 2
  - [-1, 1, Conv, [256, 3, 2]]                     # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]              # 4  P3/8
  - [-1, 1, Conv, [512, 3, 2]]                     # 5  P4/16
  - [-1, 2, C3k2, [512, True]]                     # 6  P4/16
  - [-1, 1, Conv, [1024, 3, 2]]                    # 7  P5/32
  - [-1, 2, C3k2, [1024, True]]                    # 8
  - [-1, 1, SPPF, [1024, 5]]                       # 9
  - [-1, 2, C2PSA, [1024]]                         # 10 P5/32

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 11
  - [[-1, 6], 1, Concat, [1]]                       # 12
  - [-1, 2, C3k2, [512, False]]                    # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 14
  - [[-1, 4], 1, Concat, [1]]                       # 15
  - [-1, 2, C3k2, [256, False]]                    # 16 P3/8
  - [-1, 1, CTE, [16]]                             # 17 P3_CTE

  - [-1, 1, Conv, [256, 3, 2]]                     # 18
  - [[-1, 13], 1, Concat, [1]]                      # 19
  - [-1, 2, C3k2, [512, False]]                    # 20 P4/16
  - [-1, 1, CTE, [16]]                             # 21 P4_CTE

  - [-1, 1, Conv, [512, 3, 2]]                     # 22
  - [[-1, 10], 1, Concat, [1]]                      # 23
  - [-1, 2, C3k2, [1024, True]]                    # 24 P5/32

  - [[17, 21, 24], 1, Detect, [nc]]                # 25
