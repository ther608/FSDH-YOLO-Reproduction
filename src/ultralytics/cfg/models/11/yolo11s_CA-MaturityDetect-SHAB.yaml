# YOLO11s + CA + MaturityDetect + SHAB.
# CA at P3/P4 neck; MaturityDetect head; SHAB at backbone P3/P4/P5 outputs.
# Combines spatial hierarchy attention with probabilistic maturity regression.
nc: 3
maturity_targets: [0, 1, 2]
maturity_lambda: 0.10
maturity_variance_min: 0.0001
maturity_variance_max: 100.0
scale: s
scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                      # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]                     # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]              # 2
  - [-1, 1, Conv, [256, 3, 2]]                     # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]              # 4  P3/8
  - [-1, 1, SHAB, []]                              # 5  P3 + SHAB
  - [-1, 1, Conv, [512, 3, 2]]                     # 6  P4/16
  - [-1, 2, C3k2, [512, True]]                     # 7  P4/16
  - [-1, 1, SHAB, []]                              # 8  P4 + SHAB
  - [-1, 1, Conv, [1024, 3, 2]]                    # 9  P5/32
  - [-1, 2, C3k2, [1024, True]]                    # 10
  - [-1, 1, SPPF, [1024, 5]]                       # 11
  - [-1, 2, C2PSA, [1024]]                         # 12 P5/32
  - [-1, 1, SHAB, []]                              # 13 P5 + SHAB

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 14
  - [[-1, 8], 1, Concat, [1]]                       # 15  cat backbone P4
  - [-1, 2, C3k2, [512, False]]                    # 16
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 17
  - [[-1, 5], 1, Concat, [1]]                       # 18  cat backbone P3
  - [-1, 2, C3k2, [256, False]]                    # 19 P3
  - [-1, 1, CoordAtt, [32]]                        # 20 P3_CA

  - [-1, 1, Conv, [256, 3, 2]]                     # 21
  - [[-1, 16], 1, Concat, [1]]                      # 22
  - [-1, 2, C3k2, [512, False]]                    # 23 P4
  - [-1, 1, CoordAtt, [32]]                        # 24 P4_CA

  - [-1, 1, Conv, [512, 3, 2]]                     # 25
  - [[-1, 13], 1, Concat, [1]]                      # 26  cat backbone P5
  - [-1, 2, C3k2, [1024, True]]                    # 27 P5

  - [[20, 24, 27], 1, MaturityDetect, [nc]]        # 28
