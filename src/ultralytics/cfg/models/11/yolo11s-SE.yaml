# YOLO11s-SE: Squeeze-and-Excitation at P3/P4 C3k2 output.
# Insertion position matches yolo11s-CA (P3 C3k2 → SE, P4 C3k2 → SE).
# Reference: Hu et al., "SENet" (CVPR 2018)
nc: 3
scale: s
scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                      # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]                     # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]              # 2
  - [-1, 1, Conv, [256, 3, 2]]                     # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]              # 4  P3/8
  - [-1, 1, Conv, [512, 3, 2]]                     # 5  P4/16
  - [-1, 2, C3k2, [512, True]]                     # 6  P4/16
  - [-1, 1, Conv, [1024, 3, 2]]                    # 7  P5/32
  - [-1, 2, C3k2, [1024, True]]                    # 8
  - [-1, 1, SPPF, [1024, 5]]                       # 9
  - [-1, 2, C2PSA, [1024]]                         # 10 P5/32

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 11
  - [[-1, 6], 1, Concat, [1]]                       # 12
  - [-1, 2, C3k2, [512, False]]                    # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 14
  - [[-1, 4], 1, Concat, [1]]                       # 15
  - [-1, 2, C3k2, [256, False]]                    # 16 P3
  - [-1, 1, SELayer, [16]]                         # 17 SE on P3

  - [-1, 1, Conv, [256, 3, 2]]                     # 18
  - [[-1, 13], 1, Concat, [1]]                      # 19
  - [-1, 2, C3k2, [512, False]]                    # 20 P4
  - [-1, 1, SELayer, [16]]                         # 21 SE on P4

  - [-1, 1, Conv, [512, 3, 2]]                     # 22
  - [[-1, 10], 1, Concat, [1]]                      # 23
  - [-1, 2, C3k2, [1024, True]]                    # 24 P5

  - [[17, 21, 24], 1, Detect, [nc]]                # 25
