# YOLO11n + SHAB + MaturityDetect + Lite-BiFPN.
# Fast normalized weighted fusion follows EfficientDet/BiFPN:
# https://github.com/google/automl/tree/master/efficientdet
nc: 3
maturity_targets: [0, 1, 2]
maturity_lambda: 0.10
maturity_variance_min: 0.0001
maturity_variance_max: 100.0
scale: n
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, SHAB, []]                              # P3/8
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, SHAB, []]                              # P4/16
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]
  - [-1, 1, SHAB, []]                              # P5/32

head:
  # Top-down P5 -> P4.
  - [-1, 1, Conv, [512, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 8], 1, BiFPN_Add2, [512]]
  - [-1, 2, C3k2, [512, False]]                    # P4_td

  # Top-down P4 -> P3.
  - [-1, 1, Conv, [512, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, BiFPN_Add2, [256]]
  - [-1, 2, C3k2, [256, False]]                    # P3_out

  # Bottom-up P3 -> P4 -> P5.
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 17, 8], 1, BiFPN_Add3, [512]]
  - [-1, 2, C3k2, [512, False]]                    # P4_out
  - [-1, 1, Conv, [1024, 3, 2]]
  - [[-1, 13], 1, BiFPN_Add2, [1024]]
  - [-1, 2, C3k2, [1024, True]]                    # P5_out

  - [[21, 24, 27], 1, MaturityDetect, [nc]]
