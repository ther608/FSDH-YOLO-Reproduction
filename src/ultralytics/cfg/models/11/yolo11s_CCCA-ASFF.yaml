# YOLO11s-CCCA-ASFF: CCCA attention on P3/P4 + ASFF cross-scale fusion before Detect.
# CCCA refines individual scales; ASFF fuses them with learned per-pixel weights.
nc: 3
scale: s
scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                      # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]                     # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]              # 2
  - [-1, 1, Conv, [256, 3, 2]]                     # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]              # 4
  - [-1, 1, Conv, [512, 3, 2]]                     # 5  P4/16
  - [-1, 2, C3k2, [512, True]]                     # 6
  - [-1, 1, Conv, [1024, 3, 2]]                    # 7  P5/32
  - [-1, 2, C3k2, [1024, True]]                    # 8
  - [-1, 1, SPPF, [1024, 5]]                       # 9
  - [-1, 2, C2PSA, [1024]]                         # 10

head:
  # top-down P5→P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 11
  - [[-1, 6], 1, Concat, [1]]                       # 12
  - [-1, 2, C3k2, [512, False]]                    # 13

  # top-down P4→P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 14
  - [[-1, 4], 1, Concat, [1]]                       # 15
  - [-1, 2, C3k2, [256, False]]                    # 16  P3/8
  - [-1, 1, CCCA, [16, 16, 7]]                     # 17  CCCA on P3

  # bottom-up P3→P4
  - [-1, 1, Conv, [256, 3, 2]]                     # 18
  - [[-1, 13], 1, Concat, [1]]                      # 19
  - [-1, 2, C3k2, [512, False]]                    # 20  P4/16
  - [-1, 1, CCCA, [16, 16, 7]]                     # 21  CCCA on P4

  # bottom-up P4→P5
  - [-1, 1, Conv, [512, 3, 2]]                     # 22
  - [[-1, 10], 1, Concat, [1]]                      # 23
  - [-1, 2, C3k2, [1024, True]]                    # 24  P5/32

  # ASFF cross-scale fusion
  - [[17, 21, 24], 1, ASFF3, [8]]                  # 25  ASFF(P3,P4,P5)
  - [25, 1, FeatureIndex, [0]]                     # 26  P3'
  - [25, 1, FeatureIndex, [1]]                     # 27  P4'
  - [25, 1, FeatureIndex, [2]]                     # 28  P5'
  - [[26, 27, 28], 1, Detect, [nc]]                # 29