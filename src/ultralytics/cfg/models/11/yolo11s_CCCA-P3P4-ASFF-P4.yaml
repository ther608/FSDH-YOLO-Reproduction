# YOLO11s-CCCA-P3P4-ASFF-P4: CCCA attention on P3/P4 first,
# then ASFF2 cross-scale fusion, but Detect only uses ASFF-fused P4.
# P3 retains CCCA-only features.  P5 stays standard.
# Purpose: test whether ASFF fusion helps P4 mid-level semantic context.
nc: 3
scale: s
scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                      # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]                     # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]              # 2
  - [-1, 1, Conv, [256, 3, 2]]                     # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]              # 4  P3/8
  - [-1, 1, Conv, [512, 3, 2]]                     # 5  P4/16
  - [-1, 2, C3k2, [512, True]]                     # 6  P4/16
  - [-1, 1, Conv, [1024, 3, 2]]                    # 7  P5/32
  - [-1, 2, C3k2, [1024, True]]                    # 8
  - [-1, 1, SPPF, [1024, 5]]                       # 9
  - [-1, 2, C2PSA, [1024]]                         # 10 P5/32

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 11
  - [[-1, 6], 1, Concat, [1]]                       # 12
  - [-1, 2, C3k2, [512, False]]                    # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 14
  - [[-1, 4], 1, Concat, [1]]                       # 15
  - [-1, 2, C3k2, [256, False]]                    # 16 P3/8
  - [-1, 1, CCCA, [16, 16, 7]]                     # 17 P3_CCCA

  - [-1, 1, Conv, [256, 3, 2]]                     # 18
  - [[-1, 13], 1, Concat, [1]]                      # 19
  - [-1, 2, C3k2, [512, False]]                    # 20 P4/16
  - [-1, 1, CCCA, [16, 16, 7]]                     # 21 P4_CCCA

  - [-1, 1, Conv, [512, 3, 2]]                     # 22
  - [[-1, 10], 1, Concat, [1]]                      # 23
  - [-1, 2, C3k2, [1024, True]]                    # 24 P5/32

  # ASFF2: cross-scale fusion on P3/P4 (CCCA-enhanced)
  - [[17, 21], 1, ASFF2, [8]]                      # 25 ASFF(P3_CCCA, P4_CCCA)
  - [25, 1, FeatureIndex, [0]]                     # 26 P3_ASFF (not used)
  - [25, 1, FeatureIndex, [1]]                     # 27 P4_ASFF

  # Detect: P3 from CCCA-only, P4 from ASFF, P5 standard
  - [[17, 27, 24], 1, Detect, [nc]]                # 28
