# YOLO11s + CARAFE: Content-Aware ReAssembly of FEatures.
# Replaces both nn.Upsample in the head with CARAFE for learned,
# content-aware upsampling (kernel_size=5, up_kernel=3).
# Reference: Wang et al., "CARAFE" (ICCV 2019)
nc: 3
scale: s
scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                      # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]                     # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]              # 2
  - [-1, 1, Conv, [256, 3, 2]]                     # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]              # 4  P3/8
  - [-1, 1, Conv, [512, 3, 2]]                     # 5  P4/16
  - [-1, 2, C3k2, [512, True]]                     # 6  P4/16
  - [-1, 1, Conv, [1024, 3, 2]]                    # 7  P5/32
  - [-1, 2, C3k2, [1024, True]]                    # 8
  - [-1, 1, SPPF, [1024, 5]]                       # 9
  - [-1, 2, C2PSA, [1024]]                         # 10 P5/32

head:
  - [-1, 1, CARAFE, [2, 5, 3, 64]]                 # 11  P5->P4 (CARAFE replaces Upsample)
  - [[-1, 6], 1, Concat, [1]]                       # 12  cat backbone P4
  - [-1, 2, C3k2, [512, False]]                    # 13
  - [-1, 1, CARAFE, [2, 5, 3, 64]]                 # 14  P4->P3 (CARAFE replaces Upsample)
  - [[-1, 4], 1, Concat, [1]]                       # 15  cat backbone P3
  - [-1, 2, C3k2, [256, False]]                    # 16  P3/8
  - [-1, 1, Conv, [256, 3, 2]]                     # 17
  - [[-1, 13], 1, Concat, [1]]                      # 18
  - [-1, 2, C3k2, [512, False]]                    # 19  P4/16
  - [-1, 1, Conv, [512, 3, 2]]                     # 20
  - [[-1, 10], 1, Concat, [1]]                      # 21
  - [-1, 2, C3k2, [1024, True]]                    # 22  P5/32

  - [[16, 19, 22], 1, Detect, [nc]]                # 23
