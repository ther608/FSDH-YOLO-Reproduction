# YOLO11-EMA-BN: YOLO11 with Efficient Multi-Scale Attention in Backbone + Neck
# Inserts 3 EMA modules: 1 after backbone C2PSA, 1 after P3 C3k2, 1 after P4 C3k2.
# Baseline: yolo11.yaml with EMA in backbone and neck fusion paths.
# Model docs: https://docs.ultralytics.com/models/yolo11

# Parameters
nc: 80 # number of classes
scale: m
scales: # model compound scaling constants, i.e. 'model=yolo11-EMA-BN.yaml' will call yolo11-EMA-BN.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11-EMA-BN backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10
  - [-1, 1, EMA, [32]] # 11 (EMA #1: backbone, after C2PSA)

# YOLO11-EMA-BN head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 17 (P3/8-small)
  - [-1, 1, EMA, [32]] # 18 (EMA #2: after P3 C3k2)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 21 (P4/16-medium)
  - [-1, 1, EMA, [32]] # 22 (EMA #3: after P4 C3k2)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]] # cat EMA (backbone, was C2PSA at 10)
  - [-1, 2, C3k2, [1024, True]] # 25 (P5/32-large)

  - [[18, 22, 25], 1, Detect, [nc]] # Detect(P3, P4, P5)
