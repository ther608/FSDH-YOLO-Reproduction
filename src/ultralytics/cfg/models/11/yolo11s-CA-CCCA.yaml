# YOLO11s-CA-CCCA: Coordinate Attention → CCCA dual enhancement on P3/P4
# CA: 1D positional encoding (lightweight, O(H+W)) → CCCA: covariance context calibration
# Both are channel-invariant → safe to chain serially after each C3k2 fusion
nc: 3
scale: s
scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                   # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]                  # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]           # 2
  - [-1, 1, Conv, [256, 3, 2]]                  # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]           # 4
  - [-1, 1, Conv, [512, 3, 2]]                  # 5  P4/16
  - [-1, 2, C3k2, [512, True]]                  # 6
  - [-1, 1, Conv, [1024, 3, 2]]                 # 7  P5/32
  - [-1, 2, C3k2, [1024, True]]                 # 8
  - [-1, 1, SPPF, [1024, 5]]                    # 9
  - [-1, 2, C2PSA, [1024]]                      # 10

head:
  # ── top-down P5→P4 ──
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]                    # 12
  - [-1, 2, C3k2, [512, False]]                 # 13

  # ── top-down P4→P3 ──
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 4], 1, Concat, [1]]                    # 15
  - [-1, 2, C3k2, [256, False]]                 # 16  P3 fusion

  # ── P3 dual enhancement: CA → CCCA ──
  - [-1, 1, CoordAtt, [32]]                      # 17  CA on P3 (256→256)
  - [-1, 1, CCCA, [16, 16, 7]]                   # 18  CCCA on P3 (256→256)

  # ── bottom-up P3→P4 ──
  - [-1, 1, Conv, [256, 3, 2]]                  # 19
  - [[-1, 13], 1, Concat, [1]]                   # 20
  - [-1, 2, C3k2, [512, False]]                 # 21  P4 fusion

  # ── P4 dual enhancement: CA → CCCA ──
  - [-1, 1, CoordAtt, [32]]                      # 22  CA on P4 (512→512)
  - [-1, 1, CCCA, [16, 16, 7]]                   # 23  CCCA on P4 (512→512)

  # ── bottom-up P4→P5 ──
  - [-1, 1, Conv, [512, 3, 2]]                  # 24
  - [[-1, 10], 1, Concat, [1]]                   # 25
  - [-1, 2, C3k2, [1024, True]]                 # 26  P5 (no attention)

  # ── Detect → P3=18, P4=23, P5=26 ──
  - [[18, 23, 26], 1, Detect, [nc]]             # 27