# YOLO11s-P2-CCCA-P3P4
# Adds a high-resolution P2/4 detection branch for dense tiny lychee targets.
# Keeps CCCA on P3/P4 where prior lychee validation showed stable gains.
nc: 3
scale: s
scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 2], 1, Concat, [1]] # 18 cat backbone P2
  - [-1, 2, C3k2, [128, False]] # 19-P2/4 tiny

  - [-1, 1, Conv, [128, 3, 2]] # 20
  - [[-1, 16], 1, Concat, [1]] # 21 cat head P3
  - [-1, 2, C3k2, [256, False]] # 22-P3/8 small
  - [-1, 1, CCCA, [16, 16, 7]] # 23 CCCA after P3

  - [-1, 1, Conv, [256, 3, 2]] # 24
  - [[-1, 13], 1, Concat, [1]] # 25 cat head P4
  - [-1, 2, C3k2, [512, False]] # 26-P4/16 medium
  - [-1, 1, CCCA, [16, 16, 7]] # 27 CCCA after P4

  - [-1, 1, Conv, [512, 3, 2]] # 28
  - [[-1, 10], 1, Concat, [1]] # 29 cat backbone P5
  - [-1, 2, C3k2, [1024, True]] # 30-P5/32 large

  - [[19, 23, 27, 30], 1, Detect, [nc]] # 31 Detect(P2, P3, P4, P5)
