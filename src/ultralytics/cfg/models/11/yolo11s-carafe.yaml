# Ultralytics YOLO11s + CARAFE
# Replaces nn.Upsample in neck with content-aware upsampling.
nc: 3
scale: s
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                      # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]                     # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]              # 2
  - [-1, 1, Conv, [256, 3, 2]]                     # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]              # 4  P3/8
  - [-1, 1, Conv, [512, 3, 2]]                     # 5  P4/16
  - [-1, 2, C3k2, [512, True]]                     # 6  P4/16
  - [-1, 1, Conv, [1024, 3, 2]]                    # 7  P5/32
  - [-1, 2, C3k2, [1024, True]]                    # 8
  - [-1, 1, SPPF, [1024, 5]]                       # 9
  - [-1, 2, C2PSA, [1024]]                         # 10 P5/32

head:
  - [-1, 1, CARAFE, [2, 5, 3, 64]]                 # 11 CARAFE P5→P4
  - [[-1, 6], 1, Concat, [1]]                       # 12
  - [-1, 2, C3k2, [512, False]]                    # 13

  - [-1, 1, CARAFE, [2, 5, 3, 64]]                 # 14 CARAFE P4→P3
  - [[-1, 4], 1, Concat, [1]]                       # 15
  - [-1, 2, C3k2, [256, False]]                    # 16 P3/8

  - [-1, 1, Conv, [256, 3, 2]]                     # 17
  - [[-1, 13], 1, Concat, [1]]                      # 18
  - [-1, 2, C3k2, [512, False]]                    # 19 P4/16

  - [-1, 1, Conv, [512, 3, 2]]                     # 20
  - [[-1, 10], 1, Concat, [1]]                      # 21
  - [-1, 2, C3k2, [1024, True]]                    # 22 P5/32

  - [[16, 19, 22], 1, Detect, [nc]]                # 23