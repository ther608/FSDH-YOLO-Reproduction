# YOLO11s + AFPN: Asymptotic Feature Pyramid Network
# Progressive cross-scale fusion with ASFF2 adaptive spatial weighting.
nc: 3
scale: s
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                      # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]                     # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]              # 2
  - [-1, 1, Conv, [256, 3, 2]]                     # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]              # 4  P3/8
  - [-1, 1, Conv, [512, 3, 2]]                     # 5  P4/16
  - [-1, 2, C3k2, [512, True]]                     # 6  P4/16
  - [-1, 1, Conv, [1024, 3, 2]]                    # 7  P5/32
  - [-1, 2, C3k2, [1024, True]]                    # 8
  - [-1, 1, SPPF, [1024, 5]]                       # 9
  - [-1, 2, C2PSA, [1024]]                         # 10 P5/32

head:
  # standard FPN+PAN → produce P3/P4/P5
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 11
  - [[-1, 6], 1, Concat, [1]]                       # 12
  - [-1, 2, C3k2, [512, False]]                    # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 14
  - [[-1, 4], 1, Concat, [1]]                       # 15
  - [-1, 2, C3k2, [256, False]]                    # 16 P3/8
  - [-1, 1, Conv, [256, 3, 2]]                     # 17
  - [[-1, 13], 1, Concat, [1]]                      # 18
  - [-1, 2, C3k2, [512, False]]                    # 19 P4/16
  - [-1, 1, Conv, [512, 3, 2]]                     # 20
  - [[-1, 10], 1, Concat, [1]]                      # 21
  - [-1, 2, C3k2, [1024, True]]                    # 22 P5/32

  # AFPN progressive fusion: P3↔P4, then P4↔P5
  - [[16, 19], 1, ASFF2, [8]]                      # 23 progressive fuse P3+P4
  - [23, 1, FeatureIndex, [0]]                     # 24 P3_fused
  - [23, 1, FeatureIndex, [1]]                     # 25 P4_inter
  - [[25, 22], 1, ASFF2, [8]]                      # 26 progressive fuse P4+P5
  - [26, 1, FeatureIndex, [0]]                     # 27 P4_fused
  - [26, 1, FeatureIndex, [1]]                     # 28 P5_fused
  - [[24, 27, 28], 1, Detect, [nc]]                # 29