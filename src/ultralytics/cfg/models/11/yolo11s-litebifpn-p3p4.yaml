# YOLO11s + Lite-BiFPN-P3P4
# BiFPN weighted fusion only on P3/P4; P5 keeps original PAN concat.
nc: 3
scale: s
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                      # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]                     # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]              # 2
  - [-1, 1, Conv, [256, 3, 2]]                     # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]              # 4  P3/8
  - [-1, 1, Conv, [512, 3, 2]]                     # 5  P4/16
  - [-1, 2, C3k2, [512, True]]                     # 6  P4/16
  - [-1, 1, Conv, [1024, 3, 2]]                    # 7  P5/32
  - [-1, 2, C3k2, [1024, True]]                    # 8
  - [-1, 1, SPPF, [1024, 5]]                       # 9
  - [-1, 2, C2PSA, [1024]]                         # 10 P5/32

head:
  # top-down: P5 -> P4 (standard upsample, no BiFPN at P5)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 11
  - [[-1, 6], 1, Concat, [1]]                       # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]]                    # 13 P4_td (standard PAN)

  # top-down: P4 -> P3 (BiFPN weighted fusion)
  - [-1, 1, Conv, [512, 1, 1]]                     # 14 reduce P4_td: 256->256
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 15
  - [[-1, 4], 1, BiFPN_Add2, [256]]                # 16 fuse P4_up + backbone P3
  - [-1, 2, C3k2, [256, False]]                    # 17 P3_out

  # bottom-up: P3 -> P4 (BiFPN weighted fusion)
  - [-1, 1, Conv, [512, 3, 2]]                     # 18 downsample P3->P4
  - [[-1, 13, 6], 1, BiFPN_Add3, [512]]            # 19 fuse P3_down + P4_td + backbone P4
  - [-1, 2, C3k2, [512, False]]                    # 20 P4_out

  # bottom-up: P4 -> P5 (standard PAN)
  - [-1, 1, Conv, [512, 3, 2]]                     # 21 downsample P4->P5
  - [[-1, 10], 1, Concat, [1]]                      # 22 cat backbone P5
  - [-1, 2, C3k2, [1024, True]]                    # 23 P5_out

  - [[17, 20, 23], 1, Detect, [nc]]                # 24